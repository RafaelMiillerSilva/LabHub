{% if user.is_authenticated %}
<ul class="nav navbar-nav navbar-right" style="margin-right: 0;">
    <li style="display:flex; align-items:center;">
        <span style="color: var(--lh-text-muted); font-size:13px; font-weight:600; padding:10px 14px;">
            Olá, {{ user.username }}
        </span>
    </li>
</ul>
{% else %}
<ul class="nav navbar-nav navbar-right">
    <li>
        <button type="button" class="lh-btn lh-btn--primary lh-btn--sm" data-toggle="modal" data-target="#authModal" style="margin: 12px 14px;">
            🔑 Entrar / Cadastrar
        </button>
    </li>
</ul>
{% endif %}
