{% extends "app/layout.html" %}

{% block content %}

<div style="max-width:440px; margin:30px auto 50px;">

    <div class="lh-hero">
        <div class="lh-hero-icone">🔐</div>
        <div class="lh-hero-texto">
            <h2>Acessar o LabHub</h2>
            <p>Entre com suas credenciais de acesso.</p>
        </div>
    </div>

    <div class="lh-card">
        <div class="lh-card-body">
            {% if form.errors %}
            <div class="lh-badge lh-badge--danger" style="display:block; padding:10px 14px; margin-bottom:16px; border-radius:8px;">
                Usuário ou senha incorretos. Verifique seus dados.
            </div>
            {% endif %}

            <form action="." method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'/' }}" />

                <div style="margin-bottom:14px;">
                    <label style="display:block; font-size:12px; font-weight:700; text-transform:uppercase; color:var(--lh-text-muted); margin-bottom:6px;">Nome de Usuário</label>
                    <input type="text" name="username" class="form-control" required autofocus placeholder="Seu nome de usuário">
                </div>

                <div style="margin-bottom:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <label style="font-size:12px; font-weight:700; text-transform:uppercase; color:var(--lh-text-muted); margin:0;">Senha</label>
                        <a href="{% url 'esqueci_senha' %}" style="font-size:12px; font-weight:600; color:var(--lh-primary);">Esqueceu a senha?</a>
                    </div>
                    <input type="password" name="password" class="form-control" required placeholder="Sua senha">
                </div>

                <button type="submit" class="lh-btn lh-btn--primary lh-btn--block lh-btn--lg">
                    🔑 Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

</div>

{% endblock %}
